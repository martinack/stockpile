name: Verify, Build and Publish

on:
  pull_request:
  push:
    tags:
      - 'v*'

jobs:
  verify-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run backend tests
        run: uv run --directory backend --group test pytest -q
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and test frontend
        working-directory: web
        run: |
          npm ci
          npm run build
          npm test -- --watch=false

  verify-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the smoke-test stack
        run: docker compose -f docker-compose.yml -f docker-compose.smoke.yml --project-name stockpile-smoke up --build --wait -d
      - name: Exercise the API through the frontend proxy
        run: python3 tests/docker_smoke.py
      - name: Collect container logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.smoke.yml --project-name stockpile-smoke logs
      - name: Remove smoke-test stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.smoke.yml --project-name stockpile-smoke down --volumes

  build-and-push-amd64-arm64:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            martinack/stockpile-backend:${{ github.ref_name }}
            martinack/stockpile-backend:latest
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            martinack/stockpile-web:${{ github.ref_name }}
            martinack/stockpile-web:latest

  build-and-push-armv7:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm/v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend ARM/v7
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm/v7
          push: true
          provenance: false
          cache-from: type=registry,ref=martinack/stockpile-backend:buildcache-armv7
          cache-to: type=registry,ref=martinack/stockpile-backend:buildcache-armv7,mode=max
          tags: |
            martinack/stockpile-backend:${{ github.ref_name }}
            martinack/stockpile-backend:latest

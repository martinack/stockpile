[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stockpile-backend"
version = "0.3.0"
description = "Backend API for Stockpile"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14",
  "fastapi[standard]>=0.115",
  "httpx>=0.28",
  "pydantic>=2.10",
  "psycopg[binary]>=3.2; platform_machine != 'armv7l'",
  "psycopg[c]>=3.2; platform_machine == 'armv7l'",
  "qrcode[pil]>=8.0",
  "sqlalchemy>=2.0",
]

[dependency-groups]
test = [
  "httpx>=0.28",
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["stockpile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
